name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a group
        2. Add an expense split between three people
        3. ...
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Phone
        - Tablet
        - Desktop
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Safari on iOS 18, Chrome 141, ...
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here if they help explain the problem.
